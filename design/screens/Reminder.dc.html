<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FA; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #14263D; overflow: hidden; padding: 52px 20px 24px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #14263D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">New reminder</h1>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <span style="font-size: 13px; background: #FFFFFF; border: 1px solid #DDE5EF; padding: 6px 11px; border-radius: 999px">Medicine</span>
    <span style="font-size: 13px; background: #1F5FA8; color: #FFFFFF; padding: 7px 12px; border-radius: 999px; font-weight: 600">Fever check</span>
    <span style="font-size: 13px; background: #FFFFFF; border: 1px solid #DDE5EF; padding: 6px 11px; border-radius: 999px">Follow-up visit</span>
    <span style="font-size: 13px; background: #FFFFFF; border: 1px solid #DDE5EF; padding: 6px 11px; border-radius: 999px">Refill</span>
    <span style="font-size: 13px; background: #FFFFFF; border: 1px solid #DDE5EF; padding: 6px 11px; border-radius: 999px">Blood pressure / sugar</span>
    <span style="font-size: 13px; background: #FFFFFF; border: 1px solid #DDE5EF; padding: 6px 11px; border-radius: 999px">Anything else</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #55657A">What</span><input value="Check Yassin's temperature" style="font: inherit; font-size: 16px; border: 1px solid #DDE5EF; border-radius: 12px; padding: 10px 12px; color: #14263D"></label>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #55657A">For</span><div style="display: flex; gap: 8px"><span style="font-size: 14px; background: #E6EEF8; color: #174A85; padding: 6px 12px; border-radius: 999px; font-weight: 600">Yassin</span></div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #55657A">Notify</span><div style="display: flex; gap: 8px"><span style="font-size: 14px; background: #E6EEF8; color: #174A85; padding: 6px 12px; border-radius: 999px; font-weight: 600">Mona</span><span style="font-size: 14px; background: #E6EEF8; color: #174A85; padding: 6px 12px; border-radius: 999px; font-weight: 600">Karim</span></div></div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #55657A">When</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="font-size: 13px; text-align: center; background: #F3F6FA; padding: 8px 4px; border-radius: 10px">Once</span>
      <span style="font-size: 13px; text-align: center; background: #1F5FA8; color: #FFFFFF; padding: 8px 4px; border-radius: 10px; font-weight: 600">Every few hours</span>
      <span style="font-size: 13px; text-align: center; background: #F3F6FA; padding: 8px 4px; border-radius: 10px">Daily</span>
      <span style="font-size: 13px; text-align: center; background: #F3F6FA; padding: 8px 4px; border-radius: 10px">Some weekdays</span>
      <span style="font-size: 13px; text-align: center; background: #F3F6FA; padding: 8px 4px; border-radius: 10px">Every N weeks</span>
      <span style="font-size: 13px; text-align: center; background: #F3F6FA; padding: 8px 4px; border-radius: 10px">After an event</span>
    </div>
    <div style="font-size: 16px; font-weight: 600">Every 4 hours · for 3 days · from 14:00</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #55657A">How</span>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px"><span>Full-screen alarm</span><span role="img" aria-label="On" style="width: 48px; height: 28px; border-radius: 14px; background: #1F5FA8; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px"><span>If 38°C or more, show "call doctor"</span><span style="font-size: 12px; background: #FFE8D6; color: #A14A00; padding: 4px 9px; border-radius: 999px; font-weight: 600">On</span></div>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 54px; border: 0; border-radius: 16px; background: #1F5FA8; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600">Save reminder</button>
</div>
