name: App CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

jobs:
  test:
    # `labeled` is only a trigger so `release-build` can start the release
    # job below; other labels don't re-run CI.
    if: github.event.action != 'labeled' || github.event.label.name == 'release-build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date and everything is formatted
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: test
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # The runner has ~14 GB free; the NDK plus debug native libraries for
      # three ABIs (sqlite3mc, ML Kit, notifications) no longer fit. Drop
      # preinstalled toolchains we never use.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # One ABI is enough to prove the app compiles and links; release builds
      # (later) produce per-ABI APKs / an app bundle.
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Disk left after build
        if: always()
        working-directory: /
        run: df -h /

  # Proves the Play release path (R8, resource shrinking, every ABI) still
  # builds. Main pushes only, as it is the slowest job and PRs already get
  # the debug build above; label a PR `release-build` to run it there too
  # (signing, R8 or plugin changes). No upload key here, so the bundle is
  # debug-signed (Play would reject it) and isn't kept; see docs/release.md.
  build-android-release:
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'release-build')
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Release native libraries are stripped, so all three ABIs fit where
      # three debug ABIs did not.
      - run: flutter build appbundle --release
      - name: Bundle size
        run: ls -lh build/app/outputs/bundle/release/app-release.aab
      - name: Disk left after build
        if: always()
        working-directory: /
        run: df -h /
