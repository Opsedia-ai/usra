name: App CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

# Read-only token: no job here writes to the repo.
permissions:
  contents: read

# A new push to a PR cancels its older run; main runs always finish.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # `labeled` is only a trigger so `android-build` / `release-build` can
    # start the build jobs below; other labels don't re-run CI.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'android-build' ||
      github.event.label.name == 'release-build' ||
      github.event.label.name == 'ios-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      native: ${{ steps.changes.outputs.native }}
      ios: ${{ steps.changes.outputs.ios }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The Android build is the slowest job (~10 min). Dart-only changes
      # can't break it, so PRs build it only when native code, plugins or
      # the build setup change.
      - name: Did native code, plugins or the build change?
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -Eq '^app/(android|ios)/|^app/pubspec\.(yaml|lock)$|^\.github/workflows/app-ci\.yml$|^tools/ci/'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq '^app/ios/|^app/pubspec\.(yaml|lock)$|^\.github/workflows/app-ci\.yml$'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date and everything is formatted
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test
      # Runners are on UTC; date code must also hold where clocks change
      # (Egypt has summer time). Tests that need a clock change skip on UTC.
      - name: Date tests in Cairo time
        run: TZ=Africa/Cairo flutter test test/core/prescriptions_test.dart test/core/dose_schedule_test.dart

  # PRs only: main pushes build the release bundle below, which compiles
  # the same code. Label a PR `android-build` to force it.
  build-android:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      (needs.test.outputs.native == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'android-build'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      # The runner has ~14 GB free; the NDK plus debug native libraries for
      # three ABIs (sqlite3mc, ML Kit, notifications) no longer fit. Drop
      # preinstalled toolchains we never use.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # One ABI is enough to prove the app compiles and links; release builds
      # (later) produce per-ABI APKs / an app bundle.
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Merged manifest has no cleartext or backup
        run: ../tools/ci/check_merged_manifest.sh debug
      - name: Disk left after build
        if: always()
        working-directory: /
        run: df -h /

  # Proves the iOS app (Runner plus the DoseWidget extension, CocoaPods for
  # ML Kit) compiles and links. Unsigned: no Apple certificates here. PRs
  # that touch app/ios/, the pubspec or this workflow, PRs labelled
  # `ios-build`, and main pushes. macOS runners are free for public repos
  # but slower to start.
  build-ios:
    needs: test
    if: >-
      github.event_name == 'push' ||
      needs.test.outputs.ios == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ios-build')
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/CocoaPods
            app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
      # The extension must be embedded, or no widget ships.
      - name: Dose widget is embedded
        run: test -f build/ios/iphoneos/Runner.app/PlugIns/DoseWidget.appex/DoseWidget
      # pod install must not change committed files (Podfile.lock, pbxproj).
      - name: CocoaPods integration is committed
        run: git diff --exit-code -- ios/

  # Proves the Play release path (R8, resource shrinking, every ABI) still
  # builds. Main pushes only, as it is the slowest job and PRs already get
  # the debug build above; label a PR `release-build` to run it there too
  # (signing, R8 or plugin changes). No upload key here, so the bundle is
  # debug-signed (Play would reject it) and isn't kept; see docs/release.md.
  build-android-release:
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'release-build')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # Release native libraries are stripped, so all three ABIs fit where
      # three debug ABIs did not.
      # Same flags as a Play release (docs/release.md), so obfuscation
      # breakage shows up here first.
      - name: Build release bundle
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_ENV"
          flutter build appbundle --release --obfuscate \
            --split-debug-info="build/symbols/$version"
      - name: Merged release manifest is hardened
        run: ../tools/ci/check_merged_manifest.sh release
      - name: Bundle size
        run: ls -lh build/app/outputs/bundle/release/app-release.aab
      # Dart symbols for de-obfuscating stack traces from this build. Real
      # releases keep theirs privately (docs/release.md); these are only
      # for debugging CI builds, so they expire quickly.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dart-symbols-${{ env.version }}-${{ github.sha }}
          path: app/build/symbols/
          retention-days: 7
      - name: Disk left after build
        if: always()
        working-directory: /
        run: df -h /
