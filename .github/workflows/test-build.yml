name: Test build

# An Android APK for the founder's own phones, started by hand from the
# Actions tab (or `gh workflow run test-build.yml`). Not for Play: it's
# signed with this runner's debug key, so each run's APK has a different
# signature and replacing one with the next means uninstalling first, which
# deletes the app's data on that phone. Login stays off because no
# SUPABASE_URL is passed.
on:
  workflow_dispatch:

permissions:
  contents: read

# One exact Flutter for every job, so a new stable release can't break CI
# overnight (3.50.0 did on 12 Nov). Bump it on purpose, together with the
# Android Gradle Plugin, Gradle and Kotlin versions Flutter asks for, and
# update docs/release.md. Dependabot doesn't see this line.
env:
  FLUTTER_VERSION: 3.50.0

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Release mode, as people will run it. arm64 covers phones from the
      # last several years and keeps the file small.
      - name: Build release APK
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_ENV"
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info="build/symbols/$version"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/usra-test-$version-${GITHUB_SHA::7}.apk"
      - name: Merged release manifest is hardened
        run: ../tools/ci/check_merged_manifest.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usra-test-apk-${{ env.version }}-${{ github.sha }}
          path: app/build/usra-test-*.apk
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-symbols-${{ env.version }}-${{ github.sha }}
          path: app/build/symbols/
          retention-days: 7
