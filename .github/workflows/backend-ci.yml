name: Backend CI

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check functions tests/functions
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest
      - name: Throwaway SMS hook secret for this run (config.toml requires one)
        run: echo "SEND_SMS_HOOK_SECRETS=v1,whsec_$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Lint schema
        run: supabase db lint --level warning
      - name: pgTAP tests (credits and row-level security)
        run: supabase test db
