name: Backend CI

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check functions tests/functions
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Lint schema
        run: supabase db lint --level warning
      - name: pgTAP tests (credits and row-level security)
        run: supabase test db
