<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F5F9;--surface:#FFFFFF;--raised:#EEF2F8;--line:rgba(20,38,61,.10);--text:#14263D;--muted:#55657A;--accent:#24405F;--onaccent:#FFFFFF;--amber:#9A6200;--red:#B42318;--pinkpeb:#E8CBD8;--bluepeb:#D3E0F0}
*{box-sizing:border-box}html{margin:0;background:var(--bg);display:flex;justify-content:center}
body{width:402px;height:874px;position:relative;overflow:hidden;color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif}
.d{font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif}
.page{padding:64px 20px 0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:16px;outline:1px solid var(--line);outline-offset:-1px;padding:16px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font-size:16px;font-weight:500;border:1px solid rgba(85,101,122,.35);color:var(--text);background:transparent;padding:0 16px}
.primary{background:var(--accent);color:var(--onaccent);border:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;width:64px}
nav .on{color:var(--accent)}
nav .add{margin-top:-30px}
nav .add span.c{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
svg{flex:none}
</style></head><body><div style="position:absolute;inset:0;background:rgba(20,24,32,.45)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;top:210px;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 20px;display:flex;flex-direction:column;gap:14px">
 <span style="align-self:center;width:36px;height:4px;border-radius:2px;background:rgba(85,101,122,.4)"></span>
 <div class="d" style="font-size:24px;font-weight:600">هنضيف إيه؟</div>
 <div style="display:flex;align-items:center;gap:8px"><span class="muted" style="font-size:15px">لمين؟</span>
  <span class="chip" style="min-height:40px;padding:0 16px;border:1px solid rgba(85,101,122,.35);font-size:15px">آية</span>
  <span class="chip" style="min-height:40px;padding:0 16px;background:var(--accent);color:var(--onaccent);font-size:15px">جميلة</span></div>
 <div style="background:var(--raised);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:10px;align-items:center"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><div><div style="font-size:16px;font-weight:600">صوّر روشتة أو علبة دوا</div><div class="muted" style="font-size:13px">بنقرا الكلام المطبوع بالإنجليزي، والتأكيد عليك</div></div></div>
  <div style="display:flex;gap:8px"><a class="btn primary" style="flex:1;min-height:44px">روشتة</a><a class="btn" style="flex:1;min-height:44px">علبة دوا</a></div>
 </div>
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
  <div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 7l7 7"/></svg></span>دوا</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M17 7L8 16l-3 3"/><path d="M12 7l5 5"/></svg></span>تطعيم</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M12 11v5M9.5 13.5h5"/></svg></span>زيارة</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span>تحليل</div>
  <div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 12h8"/></svg></span>أشعة</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/></svg></span>سخونية</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6"/></svg></span>وزن وطول</div><div style="background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:14px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px"><span class="muted"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M8 8l8 8"/></svg></span>عملية</div>
 </div>
 <div class="muted" style="font-size:14px;display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4M7 14h6"/></svg>كارت تأمين</div>
</div></body></html>
