<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F5F9;--surface:#FFFFFF;--raised:#EEF2F8;--line:rgba(20,38,61,.10);--text:#14263D;--muted:#55657A;--accent:#24405F;--onaccent:#FFFFFF;--amber:#9A6200;--red:#B42318;--pinkpeb:#E8CBD8;--bluepeb:#D3E0F0}
*{box-sizing:border-box}html{margin:0;background:var(--bg);display:flex;justify-content:center}
body{width:402px;height:874px;position:relative;overflow:hidden;color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif}
.d{font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif}
.page{padding:64px 20px 0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:16px;outline:1px solid var(--line);outline-offset:-1px;padding:16px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font-size:16px;font-weight:500;border:1px solid rgba(85,101,122,.35);color:var(--text);background:transparent;padding:0 16px}
.primary{background:var(--accent);color:var(--onaccent);border:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;width:64px}
nav .on{color:var(--accent)}
nav .add{margin-top:-30px}
nav .add span.c{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
svg{flex:none}
</style></head><body><div class="page">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
 <div><div class="d" style="font-size:28px;line-height:38px;font-weight:600">مساء الخير يا آية</div>
 <div class="muted" style="font-size:16px;line-height:24px"><span style="color:var(--text);text-decoration:underline;text-underline-offset:4px">جميلة</span> محتاجة انتباهك</div></div>
 <a class="btn" style="color:var(--red);min-height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--line)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>طوارئ</a>
</div>
<div style="display:flex;gap:12px">
 <div style="flex:1;height:112px;margin-top:0px;background:var(--pinkpeb);border-radius:58% 42% 55% 45% / 48% 58% 42% 52%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span class="d" style="font-size:22px;font-weight:600">آية</span><span class="muted" style="font-size:14px">مفيش حاجة مطلوبة</span></div>
 <div style="flex:1;height:112px;margin-top:18px;background:var(--pinkpeb);border-radius:45% 55% 40% 60% / 55% 45% 60% 40%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span class="d" style="font-size:22px;font-weight:600">جميلة</span><span class="chip" style="background:rgba(212,154,42,.16);color:var(--amber)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/></svg>تعبانة</span></div>
</div>
<a class="btn" style="align-self:center;border-style:dashed;min-height:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>فرد جديد</a>
<div class="card" style="display:flex;gap:12px;align-items:flex-start">
 <span style="width:36px;height:36px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span>
 <div style="flex:1;display:flex;flex-direction:column;gap:4px">
  <div style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--amber)"></span>لسه مفيش نسخة احتياطية</div>
  <div class="muted" style="font-size:14px;line-height:22px">لو الموبايل ضاع، السجلات بتضيع معاه. النسخة متشفرة وبتتحفظ برّه الموبايل</div>
  <a class="btn" style="align-self:flex-start;min-height:44px;margin-top:8px">نسخة احتياطية دلوقتي</a>
 </div>
</div>
<div class="card" style="display:flex;gap:12px;align-items:center">
 <span style="width:36px;height:36px;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M17 7L8 16l-3 3"/><path d="M12 7l5 5"/></svg></span>
 <div style="flex:1"><div style="font-size:16px;font-weight:600">تطعيمات جميلة</div>
 <div style="font-size:14px;color:var(--amber);display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--amber)"></span>١٨ جرعة ناقصة · ٧ ممكن تتاخد دلوقتي</div></div>
 <span class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
</div>
</div><nav><a class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>الرئيسية</span></a><a class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 7l7 7"/></svg><span>الأدوية</span></a><a class="add"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span style="color:var(--text)">إضافة</span></a><a class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H6V3z"/><path d="M9 12h6M9 16h6"/></svg><span>السجلات</span></a><a class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>المزيد</span></a></nav></body></html>
