<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--bg:#0C1A2E;--surface:#13233A;--raised:#182B45;--line:rgba(234,240,247,.08);--text:#EAF0F7;--muted:#A9B7CB;--accent:#83A6CE;--onaccent:#0B1B32;--amber:#E2AE55;--red:#F08A8A;--pinkpeb:#4A3550;--bluepeb:#243B5C}
*{box-sizing:border-box}html{margin:0;background:var(--bg);display:flex;justify-content:center}
body{width:402px;height:874px;position:relative;overflow:hidden;color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif}
.d{font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif}
.page{padding:64px 20px 0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:16px;outline:1px solid var(--line);outline-offset:-1px;padding:16px}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font-size:16px;font-weight:500;border:1px solid rgba(169,183,203,.35);color:var(--text);background:transparent;padding:0 16px}
.primary{background:var(--accent);color:var(--onaccent);border:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:14px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
nav{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;width:64px}
nav .on{color:var(--accent)}
nav .add{margin-top:-30px}
nav .add span.c{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
svg{flex:none}
</style></head><body><div class="page" style="gap:14px">
<div style="display:flex;align-items:center;gap:8px">
 <span style="width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
 <span style="flex:1"></span>
 <a class="btn" style="min-height:40px;color:var(--red);border-color:var(--line);background:var(--surface)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>طوارئ</a>
 <a class="btn" style="min-height:40px;border-color:var(--line)">تعديل</a>
</div>
<div style="display:flex;align-items:center;gap:14px">
 <span class="d" style="width:68px;height:64px;background:var(--pinkpeb);border-radius:45% 55% 40% 60% / 55% 45% 60% 40%;display:grid;place-items:center;font-size:28px;font-weight:600">ج</span>
 <div><div class="d" style="font-size:28px;font-weight:600;line-height:36px">جميلة</div><div class="muted">سنتين · بنتك</div></div>
</div>
<div class="card" style="padding:4px 16px">
 <div style="display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)"><span class="dot" style="background:var(--amber)"></span><div style="flex:1"><div style="font-size:16px;font-weight:600">تعبانة من النهارده</div><div class="muted" style="font-size:14px">مفيش قراءات حرارة لسه</div></div><a class="btn" style="min-height:40px">قراءة</a></div>
 <div style="display:flex;align-items:center;gap:12px;min-height:56px"><span class="dot" style="background:var(--amber)"></span><div style="flex:1"><div style="font-size:16px;font-weight:600">١٨ جرعة تطعيم ناقصة</div><div class="muted" style="font-size:14px">٧ ممكن تتاخد دلوقتي · جدول وزارة الصحة</div></div><span class="muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></div>
</div>
<div class="card" style="padding:4px 16px">
 <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);"><span class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6"/><path d="M17 7L8 16l-3 3"/><path d="M12 7l5 5"/></svg></span><div style="flex:1"><div style="font-size:16px">التطعيمات</div><div class="muted" style="font-size:14px;line-height:20px">٠ من ١٨ · جدول مصر</div></div><span class="muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></div>
 <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);"><span class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6"/></svg></span><div style="flex:1"><div style="font-size:16px">النمو</div><div class="muted" style="font-size:14px;line-height:20px">١١٫٥ كجم · ١٢ نوفمبر</div></div><span class="muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></div>
 <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);"><span class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M12 11v5M9.5 13.5h5"/></svg></span><div style="flex:1"><div style="font-size:16px">الزيارات والتحاليل</div><div class="muted" style="font-size:14px;line-height:20px">لسه مفيش</div></div><span class="muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></div>
 <div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;"><span class="muted"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4M7 14h6"/></svg></span><div style="flex:1"><div style="font-size:16px">التأمين</div><div class="muted" style="font-size:14px;line-height:20px">لسه مفيش</div></div><span class="muted"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span></div>
</div>
<div style="position:absolute;left:20px;right:20px;bottom:24px;display:flex;gap:10px">
 <a class="btn primary" style="flex:1.4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>إضافة لجميلة</a>
 <a class="btn" style="flex:1">ملخص للدكتور</a>
</div>
</div></body></html>
