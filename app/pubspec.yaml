name: usra
description: "Usra (أسرة): family medical history, kept on the phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  sqlite3: ^3.8.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  cryptography: ^2.9.0
  file_picker: ^13.3.2
  home_widget: ^0.10.0
  package_info_plus: ^10.2.2
  local_auth: ^3.0.2
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  pdf: ^3.13.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  xml: ^7.1.0

flutter:
  # CocoaPods only. ML Kit has no Swift package and needs GTMSessionFetcher 3.x,
  # while Swift packages pull 5.x for Google Sign-In: mixing them links both
  # versions into the app, and which one runs is undefined.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/medicines/egypt_medicine_names.txt
    # PDF reports (OFL 1.1, see OFL.txt there).
    - assets/fonts/amiri/Amiri-Regular.ttf
    - assets/fonts/amiri/Amiri-Bold.ttf
    - assets/fonts/amiri/OFL.txt

hooks:
  user_defines:
    sqlite3:
      # SQLite3 Multiple Ciphers: encrypted database (PRAGMA key)
      source: sqlite3mc
