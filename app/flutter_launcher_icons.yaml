# App icon from the Nile blue logo in design/. Regenerate after changing the
# source PNGs (tools/branding/render_icons.py):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: ic_launcher
  min_sdk_android: 24
  adaptive_icon_background: "#1F5FA8"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
